<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glucolog">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <title>Glucolog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <h1>Glucolog</h1>
      <div class="date-nav">
        <button id="prevDay" aria-label="Предыдущий день">‹</button>
        <span class="date-label" id="dateLabel"></span>
        <button id="nextDay" aria-label="Следующий день">›</button>
      </div>
    </header>

    <section class="section" id="sec-glucose">
      <div class="section-title">Глюкоза крови</div>
      <div class="chart-wrap">
        <canvas id="glucoseChart"></canvas>
      </div>
      <div class="chart-xlabels">
        <span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
      </div>
      <div class="add-glucose">
        <input type="number" id="glucoseVal" placeholder="ммоль/л" min="1" max="30" step="0.1" aria-label="Значение глюкозы">
        <select id="glucoseHour" aria-label="Час измерения"></select>
        <button id="addGlucoseBtn" class="btn">+ добавить</button>
      </div>
    </section>

    <section class="section" id="sec-insulin">
      <div class="section-title">Инсулин</div>
      <div class="ins-row">
        <label for="bolus">Болюс</label>
        <input type="number" id="bolus" placeholder="ед." min="0" step="0.5" aria-label="Болюс">
        <label for="basal">Базальный</label>
        <input type="number" id="basal" placeholder="ед." min="0" step="0.5" aria-label="Базальный инсулин">
      </div>
    </section>

    <section class="section" id="sec-meals">
      <div class="section-title">Приёмы пищи</div>
      <div class="meal-list" id="mealList"></div>
    </section>

    <section class="section" id="sec-water">
      <div class="section-title">Вода</div>
      <div class="section-hint">Норма: 8 стаканов × 200 мл</div>
      <div class="water-track" id="waterTrack"></div>
    </section>

    <section class="section" id="sec-sport">
      <div class="section-title">Спорт</div>
      <div class="toggle-row" id="sportRow">
        <button class="toggle-btn" data-val="true">Да</button>
        <button class="toggle-btn active" data-val="false">Нет</button>
      </div>
      <div class="steps-row">
        <input type="number" id="steps" placeholder="0" min="0" aria-label="Количество шагов">
        <span class="steps-label">шагов</span>
      </div>
    </section>

    <section class="section" id="sec-stool">
      <div class="section-title">Стул</div>
      <div class="stool-grid" id="stoolGrid"></div>
    </section>

    <section class="section" id="sec-sleep">
      <div class="section-title">Сон</div>
      <div class="sleep-row">
        <label for="sleepStart">Лёг</label>
        <input type="time" id="sleepStart" aria-label="Время отхода ко сну">
        <label for="sleepEnd">Встал</label>
        <input type="time" id="sleepEnd" aria-label="Время подъёма">
        <span class="sleep-duration" id="sleepDuration"></span>
      </div>
    </section>

    <section class="section" id="sec-stress">
      <div class="section-title">Стресс</div>
      <div class="toggle-row" id="stressRow"></div>
    </section>

    <section class="section" id="sec-notes">
      <div class="section-title">Заметки</div>
      <textarea id="notes" class="notes" placeholder="Заметки дня..." rows="3" aria-label="Заметки"></textarea>
    </section>

    <section class="section last" id="sec-conclusions">
      <div class="section-title">Выводы дня</div>
      <textarea id="conclusions" class="notes" placeholder="Выводы..." rows="3" aria-label="Выводы дня"></textarea>
    </section>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
